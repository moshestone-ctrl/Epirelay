# Supabase pauses free projects after a week with little activity, which would take the app offline.
# This makes a tiny request to the server twice a day so that never happens.
# (Upgrading the Supabase project to the Pro plan removes the need for this.)
name: Keep server awake

on:
  schedule:
    - cron: '23 13 * * *'
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .env
          sparse-checkout-cone-mode: false
      - name: Ping the EpiRelay server
        run: |
          set -a; . ./.env; set +a
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X POST \
              "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "Attempt $i: HTTP $code $(cat /tmp/out.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::The server didn't respond. It may be paused — open the Supabase dashboard and press Resume."
          exit 1
